name = "lifepo4-qa-api"
type = "service"
compatibility_date = "2024-03-12"

[env.production]
routes = [
  { pattern = "api.lifepo4.solar/*", zone_name = "lifepo4.solar" }
]

[[r2_buckets]]
binding = "QA_DATA"
bucket_name = "lifepo4-qa-data"

[vars]
ENVIRONMENT = "production"
API_VERSION = "2.0"
CHEMISTRY_FILTER = "lifepo4"

[triggers]
crons = ["0 2 * * *"]
