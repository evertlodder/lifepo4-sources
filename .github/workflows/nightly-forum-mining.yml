name: Nightly LiFePO4 Forum Mining

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  mine-forums:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run mining script
        run: node scripts/mine-forums-global-v2-FILTERED.js
        env:
          NODE_ENV: production
      
      - name: Validate output
        run: |
          if [ -f "/mnt/user-data/outputs/lifepo4-qa-*.json" ]; then
            echo "✅ Mining completed successfully"
          else
            echo "⚠️  Warning: No output generated"
          fi
      
      - name: Commit results (if new)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add data/qa-output/
            git commit -m "chore: update LiFePO4 Q&A data from nightly mining"
            git push
          fi
      
      - name: Notify on failure
        if: failure()
        run: echo "❌ Mining job failed - check logs"
