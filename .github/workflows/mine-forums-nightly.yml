name: 🌍 Mine LiFePO4 Forums Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  mine-forums:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: |
          npm ci
          npm install --save axios cheerio
      
      - name: 📁 Create output directory
        run: mkdir -p output
      
      - name: 🚀 Run forum mining orchestrator
        run: |
          node scripts/mine-forums-global-v2-FILTERED.js
      
      - name: 💾 Upload results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forum-qa-output
          path: output/lifepo4-qa-*.json
          retention-days: 30
