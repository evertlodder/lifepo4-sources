name: Mine LiFePO4 Forums Nightly
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  mine-forums:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci && npm install axios cheerio
      - run: mkdir -p output
      - run: node scripts/mine-forums-global-v2-FILTERED.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forum-qa-output
          path: output/lifepo4-qa-*.json
          retention-days: 30
